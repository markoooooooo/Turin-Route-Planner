[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route-planner"
version = "0.1.0"
description = "Time-dependent public transport route planner on GTT Turin GTFS data"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
map = ["folium"]

[tool.pytest.ini_options]
testpaths = ["tests"]